name: Test athome a ritmo lento

on:
  push:
    branches: [main]
    paths: ["trigger/athome-test.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { delay: 60, pages: 12 }
          - { delay: 180, pages: 10 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Una pagina ogni ${{ matrix.delay }} s
        run: python scripts/athome_pace_test.py --delay ${{ matrix.delay }} --pages ${{ matrix.pages }}
