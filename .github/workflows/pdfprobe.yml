name: Prova PDF akiya bank

on:
  push:
    branches: [main]
    paths: ["trigger/pdfprobe.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/pdf_probe.py --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdfprobe-${{ strategy.job-index }}
          path: pdfprobe-*.yml

  save:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "pdfprobe-*", merge-multiple: true }
      - run: |
          git config user.name "akiya-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add pdfprobe-*.yml
          git commit -m "Prova PDF akiya bank $(date -u +%F)" || echo "nessuna modifica"
          git pull --rebase -q origin main && git push
