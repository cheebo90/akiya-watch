name: Ispeziona akiya bank da sistemare

on:
  push:
    branches: [main]
    paths: ["trigger/inspect.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          ARGS=$(python3 -c "import json;d=json.load(open('trigger/inspect.json'));print('--try '+d['try'] if d.get('try') else ' '.join('--pref '+p for p in d['prefs']))")
          python scripts/inspect_todo.py $ARGS
      - run: |
          git config user.name "akiya-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add inspect*.yml
          git commit -m "Ispezione akiya bank $(date -u +%F)" || echo "nessuna modifica"
          git pull --rebase -q origin main && git push
