name: Aggiorna annunci

on:
  schedule:
    # GitHub fa partire i giri programmati anche con 4-5 ore di ritardo: orari anticipati perché
    # l'aggiornamento sia pronto la mattina a Sydney
    - cron: "17 13 * * *"   # 13:17 UTC = 00:17 a Sydney (23:17 con l'ora solare)
    - cron: "47 16 * * *"   # riserva: parte solo se nelle 6 ore prima non è partito nessun giro
  push:
    branches: [main]
    paths: ["trigger/scrape.json"]   # avvio da remoto: basta modificare questo file
  workflow_dispatch:
    inputs:
      sources:
        description: "Fonti da leggere (JSON)"
        default: '["suumo:1/4","suumo:2/4","suumo:3/4","suumo:4/4","yahoo:1/3","yahoo:2/3","yahoo:3/3","akiyabank"]'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

# Portali (SUUMO, Yahoo) e akiya bank sono separati: l'app si aggiorna appena finiscono i portali,
# le akiya bank (più lente) si aggiungono con una seconda unione quando arrivano.
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      portals: ${{ steps.s.outputs.portals }}
      akiya: ${{ steps.s.outputs.akiya }}
      expect: ${{ steps.s.outputs.expect }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT='["suumo:1/4","suumo:2/4","suumo:3/4","suumo:4/4","yahoo:1/3","yahoo:2/3","yahoo:3/3","akiyabank"]'
          if [ -n "${{ github.event.inputs.sources }}" ]; then SRC='${{ github.event.inputs.sources }}'
          elif [ "${{ github.event_name }}" = "push" ] && [ -f trigger/scrape.json ]; then SRC=$(python3 -c "import json;print(json.dumps(json.load(open('trigger/scrape.json'))['sources']))")
          else SRC="$DEFAULT"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "47 16 * * *" ]; then
            # backup slot: skip if another run of this workflow started in the last 3 hours
            SINCE=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?created=>$SINCE&per_page=20" \
                 --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
            if [ "$N" -gt 0 ]; then echo "Giro già partito nelle ultime 6 ore: la riserva non fa nulla."; SRC='[]'; fi
          fi
          python3 - "$SRC" "${{ github.event_name }}" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          src = json.loads(sys.argv[1]); scheduled = sys.argv[2] == "schedule"
          portals = [s for s in src if not s.startswith("akiyabank")]
          print("portals=" + json.dumps(portals))
          print("akiya=" + ("true" if any(s.startswith("akiyabank") for s in src) else "false"))
          print("expect=" + (",".join(sorted({s.split(":")[0] for s in portals})) if scheduled else ""))
          PY
          cat "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    if: needs.plan.outputs.portals != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.portals) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Leggi ${{ matrix.source }}
        env:
          AKIYA_PASSPHRASE: ${{ secrets.AKIYA_PASSPHRASE }}
        run: |
          SRC="${{ matrix.source }}"
          python -m scraper.run scrape --source "${SRC%%:*}" --part "$( [[ "$SRC" == *:* ]] && echo "${SRC#*:}" || echo 1/1 )"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-p-${{ strategy.job-index }}
          path: data/raw-*.enc
          if-no-files-found: ignore
          retention-days: 3

  akiyabank:
    needs: plan
    if: needs.plan.outputs.akiya == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Leggi akiya bank
        env:
          AKIYA_PASSPHRASE: ${{ secrets.AKIYA_PASSPHRASE }}
        run: python -m scraper.run scrape --source akiyabank
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-akiyabank
          path: |
            data/raw-*.enc
            data/photos/
          if-no-files-found: ignore
          retention-days: 3

  merge:
    needs: [plan, scrape]
    if: always() && needs.scrape.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: data, pattern: "raw-p-*", merge-multiple: true }
      - name: Unisci, geolocalizza, avvisa
        id: merge
        env:
          AKIYA_PASSPHRASE: ${{ secrets.AKIYA_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EXPECT_SOURCES: ${{ needs.plan.outputs.expect }}
        run: python -m scraper.run merge
      - name: Foto cifrate (ramo photos)
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: photos, path: web/p }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Salva dati cifrati
        if: always() && steps.merge.outcome == 'success'
        run: |
          git config user.name "akiya-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.enc web/data.enc
          git commit -m "Aggiornamento annunci $(date -u +%F)" || { echo "nessuna modifica"; exit 0; }
          git pull --rebase origin main || { echo "::error::archivio cambiato durante il giro, non sovrascrivo"; exit 1; }
          git push origin HEAD:main

  merge-akiyabank:
    needs: [merge, akiyabank]
    if: always() && needs.akiyabank.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # dopo la prima unione: parte dall'archivio appena salvato
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: data, name: raw-akiyabank }
      - name: Unisci le akiya bank
        id: merge
        env:
          AKIYA_PASSPHRASE: ${{ secrets.AKIYA_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EXPECT_SOURCES: akiyabank
        run: python -m scraper.run merge
      - name: Foto cifrate (ramo photos)
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: photos, path: web/p }
      - name: Aggiungi le foto nuove, togli quelle non più usate
        if: steps.merge.outcome == 'success'
        run: |
          mkdir -p web/p
          cp data/photos/*.bin web/p/ 2>/dev/null || true
          if [ -s data/photos-keep.txt ]; then
            for f in web/p/*.bin; do [ -e "$f" ] || continue; grep -qx "$(basename "$f")" data/photos-keep.txt || rm "$f"; done
          fi
          echo "foto: $(ls web/p/*.bin 2>/dev/null | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web, name: github-pages-akiyabank }
      - id: deploy
        uses: actions/deploy-pages@v4
        with: { artifact_name: github-pages-akiyabank }
      - name: Salva dati cifrati
        if: always() && steps.merge.outcome == 'success'
        run: |
          git config user.name "akiya-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.enc web/data.enc
          git commit -m "Aggiornamento akiya bank $(date -u +%F)" || { echo "nessuna modifica"; exit 0; }
          git pull --rebase origin main || { echo "::error::archivio cambiato durante il giro, non sovrascrivo"; exit 1; }
          git push origin HEAD:main
      - name: Salva le foto (ramo photos, un solo commit)
        if: always() && steps.merge.outcome == 'success'
        run: |
          cd web/p 2>/dev/null || exit 0
          ls *.bin >/dev/null 2>&1 || exit 0
          [ -d .git ] || git init -q -b photos
          git config user.name "akiya-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan tmp-photos
          git add -A .
          git commit -qm "Foto cifrate $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:photos
