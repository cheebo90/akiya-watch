name: Aggiorna annunci

on:
  schedule:
    - cron: "17 18 * * *"   # ogni giorno alle 18:17 UTC = 05:17 a Sydney (04:17 con l'ora solare)
  push:
    branches: [main]
    paths: ["trigger/scrape.json"]   # avvio da remoto: basta modificare questo file
  workflow_dispatch:
    inputs:
      sources:
        description: "Fonti da leggere (JSON)"
        default: '["suumo:1/3","suumo:2/3","suumo:3/3","yahoo:1/3","yahoo:2/3","yahoo:3/3","akiyabank"]'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.s.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          DEFAULT='["suumo:1/3","suumo:2/3","suumo:3/3","yahoo:1/3","yahoo:2/3","yahoo:3/3","akiyabank"]'
          if [ -n "${{ github.event.inputs.sources }}" ]; then SRC='${{ github.event.inputs.sources }}'
          elif [ "${{ github.event_name }}" = "push" ] && [ -f trigger/scrape.json ]; then SRC=$(python3 -c "import json;print(json.dumps(json.load(open('trigger/scrape.json'))['sources']))")
          else SRC="$DEFAULT"; fi
          echo "sources=$SRC" >> "$GITHUB_OUTPUT"; echo "Fonti: $SRC"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Leggi ${{ matrix.source }}
        env:
          AKIYA_PASSPHRASE: ${{ secrets.AKIYA_PASSPHRASE }}
        run: |
          SRC="${{ matrix.source }}"
          python -m scraper.run scrape --source "${SRC%%:*}" --part "$( [[ "$SRC" == *:* ]] && echo "${SRC#*:}" || echo 1/1 )"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ strategy.job-index }}
          path: data/raw-*.enc
          if-no-files-found: ignore
          retention-days: 3

  merge:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: data, pattern: "raw-*", merge-multiple: true }
      - name: Unisci, geolocalizza, avvisa
        id: merge
        env:
          AKIYA_PASSPHRASE: ${{ secrets.AKIYA_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FULL_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python -m scraper.run merge
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Salva dati cifrati
        if: always() && steps.merge.outcome == 'success'
        run: |
          git config user.name "akiya-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.enc web/data.enc
          git commit -m "Aggiornamento annunci $(date -u +%F)" || { echo "nessuna modifica"; exit 0; }
          git pull --rebase origin main || { echo "::error::archivio cambiato durante il giro, non sovrascrivo"; exit 1; }
          git push origin HEAD:main
