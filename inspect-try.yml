      Facebook instagram SUMITSUKE(すみつけ)那珂川 空き家バンク 山小屋ワンルーム 売買 入居済 空き家バンク 山小屋ワンルーム 猿山の最果ての集落にある小振りな山小屋 大工さんが自分用に建てられたという山小屋だけに作りもしっかりとしていそうです 囲炉裏に暖炉と隠れ家を楽しむ要素も備わっています 道中はこんな森の中を抜けていきます 中ノ島公園を過ぎて麓の集落を過ぎ森に入って、さらに林道を突き進んでいくと辿り着く最果ての集落。
      久しぶりにこの場所に来たのですが、途中の林道は離合できない道幅の場所もあるし、初めての方はこのまま進んでいいのか?!と、一瞬戸惑ってしまうかもしれません。それでも先へ進んでいくと、突如としてパッと開けた場所に数軒の住宅群が現れてきて、その中に今回の山小屋があります。 この辺りは通称「猿山」と呼ばれています。秘境感もありますが、ポツンと一軒家ではあ
