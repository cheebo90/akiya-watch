# akiya-watch — configurazione
# Modifica questo file direttamente su GitHub: le modifiche valgono dal giro successivo.

# Il tuo budget (dollari australiani): usato dagli avvisi e come filtro iniziale dell'app.
budget_aud: 80000
# Tetto dell'archivio (yen): lo script salva solo annunci fino a questo prezzo.
max_price_yen: 13500000

# Prefetture da leggere: "all" oppure una lista, es. [kagoshima, miyazaki, kumamoto, oita, fukuoka]
prefectures: all

sources:
  lifull:                 # LIFULL HOME'S Akiya Bank (akiya delle banche comunali)
    enabled: true
  athome:                 # athome.co.jp (case e appartamenti usati)
    enabled: true
    # athome mostra una verifica anti-bot se le richieste sono rapide: qui si va a ritmo "umano".
    # Se compare comunque la verifica, lo script si ferma subito: in quel caso metti enabled: false.
    request_delay_sec: 15
    # case usate, appartamenti usati, case nuove, appartamenti con inquilino (con rendimento),
    # negozi, uffici, edifici interi / palazzine
    categories: [kodate/chuko, mansion/chuko, kodate/shinchiku, mansion/ownerchange, buy_store, buy_office, buy_other]
  suumo:                  # SUUMO (solo pagine per città, consentite dal robots.txt)
    enabled: true
    categories: [chukoikkodate, ms/chuko, ikkodate]   # ikkodate = case nuove
  akiyabank:              # akiya bank di prefetture e comuni (elenco siti in akiyabanks.yml)
    enabled: true

# Pausa tra una richiesta e l'altra (secondi). Non scendere sotto 1.5: è una questione di rispetto per i siti.
request_delay_sec: 2.0
# Limite di richieste per giro (protegge i siti e la durata del job su GitHub).
max_requests_per_run: 9000

# Avvisi: un annuncio NUOVO che rispetta almeno uno di questi filtri genera una notifica.
# Campi possibili: max_price_aud, min_price_aud, types [house, apartment, land, akiya, building, commercial],
# prefectures [...], min_building_m2, min_land_m2, max_walk_min, built_after, min_yield_pct, new_build (true/false)
alerts:
  - name: Casa sotto budget
    max_price_aud: 80000
    types: [house, akiya]
    min_building_m2: 50
  - name: Appartamento sotto budget
    max_price_aud: 80000
    types: [apartment]
    min_building_m2: 30
    max_walk_min: 15

  - name: Investimento con rendimento dichiarato alto
    max_price_aud: 120000
    min_yield_pct: 10

max_push_per_run: 15
email_digest: true
