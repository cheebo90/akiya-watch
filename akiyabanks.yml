# Akiya bank verificate a mano. Il censimento mensile (census.yml) aggiunge da solo quelle che riesce a leggere.
# Campi: id, name, prefecture, list (pagina elenco), pages (suffisso per le pagine successive, {n} = numero),
#        detail (regex dei link alle schede), max_pages, max_details (schede nuove lette al giorno), status
sites:
  - id: hokkaido-pref
    name: 北海道空き家情報バンク
    prefecture: hokkaido
    list: https://www.hokkaido-akiya.com/index?usePage=1
    pages: "&page={n}"
    detail: "/detail\\?id=\\d+$"
    max_pages: 700          # ~670 pagine da 8, più recenti prima
    max_details: 500        # il primo riempimento richiede ~10 giorni
    status: ok

  - id: ibaraki-pref
    name: いばらき移住定住ポータル Re:BARAKI 空き家バンク
    prefecture: ibaraki
    list: https://iju-ibaraki.jp/residence/
    detail: "/residence/akiya/\\d+\\.html$"
    max_pages: 1
    max_details: 300
    status: ok

  - id: niigata-pref
    name: 新潟県 空き家情報検索システム（にいがた暮らし）
    prefecture: niigata
    list: https://niigatakurashi.com/akiya-search/
    pages: "page/{n}/"
    detail: "niigatakurashi\\.com/akiya/\\d+/$"
    max_pages: 20
    max_details: 200
    status: ok

  - id: mie-pref
    name: 美し国みえ 移住ポータル 空き家バンク
    prefecture: mie
    list: https://www.ijyu.pref.mie.lg.jp/bank/
    pages: "page/{n}/"
    detail: "/bank/\\d+/$"
    max_pages: 15
    max_details: 200
    status: ok

  # ---- Kyushu: verificate con scripts/inspect_todo.py --try (novembre 2026)
  - {id: saga-takeo, name: 武雄市空き家バンク, prefecture: saga, list: "https://takeo-ijyu.jp/bank/", detail: "takeo-ijyu\\.jp/bank/\\d+/$", status: ok}
  - {id: saga-shiroishi, name: 白石町空き家・空き地バンク, prefecture: saga, list: "https://www.shiroishi-town.jp/akiya/", detail: "/akiya/vacant(house|land)/\\d+\\.php$", status: ok}
  - {id: fukuoka-koge, name: 上毛町空き家・空き地バンク, prefecture: fukuoka, list: "https://www.town.koge.lg.jp/cgi-bin/recruit.php/1/list", detail: "/recruit\\.php/\\d+/detail/\\d+", status: ok}
  - {id: fukuoka-sumitsuke, name: 那珂川市空き家バンク SUMITSUKE, prefecture: fukuoka, list: "https://sumitsuke.net/bank", detail: "sumitsuke\\.net/bank/\\d+$", status: ok}
  - {id: kumamoto-nankan, name: 南関町空き家バンク（くまもと空き家360）, prefecture: kumamoto, list: "https://www.town.nankan.lg.jp/kurashi/kurashisodan/4283.html", detail: "kumamoto-akiya360\\.jp/property/p\\d+/$", status: ok}
  - {id: kumamoto-tsunagi, name: 津奈木町空き家バンク, prefecture: kumamoto, list: "https://www.town.tsunagi.lg.jp/teiju/hpkiji/pub/List.aspx?c_id=3&class_set_id=8&class_id=812", detail: "/teiju/page\\d+\\.html$", status: ok}
  - {id: oita-tsukumi, name: 津久見市空き家バンク, prefecture: oita, list: "https://iju-tsukumi.jp/rents/", detail: "iju-tsukumi\\.jp/\\w+/detail/\\d+$", status: ok}
  - {id: oita-kitsuki, name: 杵築市空き家バンク, prefecture: oita, list: "https://www.city.kitsuki.lg.jp/cgi-bin/recruit.php/1/list", detail: "/recruit\\.php/\\d+/detail/\\d+", status: ok}
  - {id: oita-bungoono, name: 豊後大野市空き家バンク, prefecture: oita, list: "https://bungoono-iju.com/", detail: "bungoono-iju\\.com/akiya/\\d+/$", status: ok}
  - {id: miyazaki-ebino, name: えびの市空き家バンク, prefecture: miyazaki, list: "http://www.ebikyan.jp/list", detail: "ebikyan\\.jp/vacant/[^/]+/$", status: ok}
  - {id: miyazaki-kunitomi, name: 国富町空き家バンク, prefecture: miyazaki, list: "http://sousei.town.kunitomi.miyazaki.jp/houselist/", detail: "/houselist/\\d+/\\d+/\\d+/house_\\d+\\.html$", status: ok}
  - {id: kagoshima-kanoya, name: 鹿屋市空き家バンク, prefecture: kagoshima, list: "https://www.city.kanoya.lg.jp/iju/akiyabank/search/", detail: "/iju/akiyabank/search/\\d+\\.html$", status: ok}
